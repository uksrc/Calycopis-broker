#
# A GitHub workflow to build and publish the broker packages.
#

name: Calycopis OpenAPI broker

on:
  push:
    branches:
      - 'main'

  pull_request:

  workflow_dispatch:

jobs:

  build-java-broker:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      # https://github.com/actions/checkout
      - name: Checkout the schema project
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install our Maven settings
        run: |
            mkdir -p ~/.m2
            cp -f codegen/java/settings.xml \
                  ~/.m2/settings.xml

      - name: Check our Maven settings
        run: |
            cat ~/.m2/settings.xml

      # https://github.com/actions/cache/blob/main/examples.md#java---maven
      - name: Cache our Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build the Java jar file
        working-directory: java
        run: |
          ./mvnw \
            --batch-mode \
            clean install

      - name: Get the Maven POM version
        working-directory: java
        run: |
          echo "pomversion=$(
              ./mvnw \
                  -q \
                  help:evaluate \
                  -Dexpression=project.version \
                  -DforceStdout \
                  2> /dev/null
              )" \
              >> "$GITHUB_ENV"

      - name: Check the Maven POM version
        run: |
            echo "POM version [${{env.pomversion}}]"

      - name: Upload the Java JAR as a GitHub artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'calycopis-broker-'
          path: 'java/target/calycopis-broker-${{env.pomversion}}.jar'

      - name: Publish the JAR to the UKSRC Nexus repository.
        if: >
            github.repository == 'uksrc/Calycopis-broker' &&
            github.event_name == 'push' &&
            github.ref_name == 'main'
        working-directory: java
        run: |
          ./mvnw \
            --batch-mode \
            deploy \
              -Puksrc-profile
        env:
          UKSRC_REPO_USERNAME: ${{ secrets.UKSRC_REPO_USERNAME }}
          UKSRC_REPO_PASSWORD: ${{ secrets.UKSRC_REPO_PASSWORD }}

      - name: Publish the JAR to the IVOA GitHub repository.
        if: >
            github.repository == 'ivoa/Calycopis-openapi' &&
            github.event_name == 'push' &&
            github.ref_name == 'main'
        working-directory: codegen/java/client
        run: |
          ./mvnw \
            --batch-mode \
            deploy \
              -Pivoa-profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package the broker in a OCI container
        working-directory: java
        run: |
          ./mvnw \
            --batch-mode \
            spring-boot:build-image

